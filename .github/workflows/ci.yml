name: Node.js CI

# Kích hoạt workflow mỗi khi có code được push lên nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Kéo mã nguồn từ repository về môi trường chạy
    - name: Checkout repository
      uses: actions/checkout@v3

    # Bước 2: Cài đặt Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20' 

    # Bước 3: Cài đặt các thư viện (Jest) dựa trên package.json
    - name: Install dependencies
      run: npm install

    # Bước 4: Chạy lệnh test
    - name: Run Jest tests
      run: npm test
