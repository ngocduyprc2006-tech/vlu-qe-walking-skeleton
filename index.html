<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Skeleton - Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .login-box { border: 1px solid #ccc; padding: 20px; max-width: 300px; }
        input { margin-bottom: 10px; width: 90%; padding: 5px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Đăng nhập</h2>
        <form id="loginForm">
            <label for="username">Tài khoản:</label>
            <input type="text" id="username" required>
            
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" required>
            
            <button type="button" onclick="handleLogin()">Đăng nhập</button>
        </form>
        <p id="message"></p>
    </div>

    <!-- Nhúng file logic Javascript -->
    <script src="login.js"></script>
    
    <!-- Xử lý sự kiện click trên trình duyệt -->
    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            // Gọi hàm checkLogin từ file login.js
            if (checkLogin(user, pass)) {
                message.style.color = "green";
                message.innerText = "Đăng nhập thành công!";
            } else {
                message.style.color = "red";
                message.innerText = "Sai tài khoản hoặc mật khẩu!";
            }
        }
    </script>
</body>
</html>
